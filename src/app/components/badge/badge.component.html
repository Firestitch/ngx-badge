<div class="fs-badge"
    [ngClass]="{ 
      'fs-badge-circle': shape === 'circle', 
      'fs-badge-square': shape === 'square', 
      'fs-badge-image': type === 'image', 
      'fs-badge-text': type === 'text',
      'fs-badge-icon': type === 'icon'      
    }"
  [ngStyle]="styles"
  [matTooltip]="tooltip">
  @if (!image && icon) {
    <mat-icon [ngStyle]="iconStyle">{{ icon }}</mat-icon>
  }
  @if (!image && text) {
    {{ text }}
  }
</div>
